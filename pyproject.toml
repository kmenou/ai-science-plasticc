[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plasticc-course"
version = "0.1.0"
description = "Minimal teaching repository for the PLAsTiCC data challenge"
requires-python = ">=3.11,<3.15"
dependencies = [
  "celerite2>=0.3.3",
  "h5py>=3.16.0",
  "lightgbm>=4.7.0",
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "pyarrow>=17,<23",
  "pytest>=8,<10",
  "rebound>=5.2.0",
  "scikit-learn>=1.9.1",
  "scipy>=1.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plasticc_course"]

